services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DEMO_EMPLOYEE_ID: ${DEMO_EMPLOYEE_ID:-E0002}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - career-quest-state:/app/runtime
volumes:
  career-quest-state:
